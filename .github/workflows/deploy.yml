name: Deploy Website via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🔧 Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🏗️ Build Project
      run: npm run build

    - name: 🧹 Sanitize FTP Server URL
      run: |
        CLEAN_SERVER=$(echo "${{ secrets.FTP_SERVER }}" | sed -e 's|^[a-zA-Z]*://||' -e 's|/.*$||' -e 's| *$||')
        echo "CLEAN_SERVER=$CLEAN_SERVER" >> $GITHUB_ENV

    - name: 🚀 Sync Files to Hostinger FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ env.CLEAN_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/
        protocol: ftp
        port: 21
